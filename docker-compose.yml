services:
  app:
    build: .
    container_name: mtsn1_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html
      - /var/www/html/vendor
    environment:
      CI_ENVIRONMENT: "${CI_ENVIRONMENT:-development}"
      app.baseURL: "${APP_BASE_URL:-http://localhost:8080/}"
      database.default.hostname: db
      database.default.port: "3306"
      database.default.database: "${DB_NAME:-mtsn1sijunjung_db}"
      database.default.username: "${DB_USER:-mtsn1}"
      database.default.password: "${DB_PASSWORD:?DB_PASSWORD is required}"
      database.default.DBDriver: MySQLi
      database.default.DBPrefix: ""
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    container_name: mtsn1_db
    restart: unless-stopped
    ports:
      - "${DB_PORT:-3307}:3306"
    environment:
      MYSQL_DATABASE: "${DB_NAME:-mtsn1sijunjung_db}"
      MYSQL_USER: "${DB_USER:-mtsn1}"
      MYSQL_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}"
    volumes:
      - db_data:/var/lib/mysql
      - ./mtsn1sijunjung_db.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  db_data:
